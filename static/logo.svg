<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="120" viewBox="0 0 600 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="headerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#303F9F" />
      <stop offset="100%" stop-color="#7B1FA2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Main background rounded rectangle -->
  <rect x="10" y="10" width="580" height="100" rx="20" ry="20" fill="url(#headerGradient)" />
  
  <!-- Data flow lines -->
  <path d="M50,60 C100,20 150,100 200,60 S250,20 300,60 S350,100 400,60 S450,20 500,60" 
        stroke="rgba(255,255,255,0.4)" stroke-width="3" fill="none" stroke-linecap="round" />
  
  <!-- Decorative data points/nodes -->
  <circle cx="50" cy="60" r="5" fill="#fff" filter="url(#glow)" />
  <circle cx="200" cy="60" r="5" fill="#fff" filter="url(#glow)" />
  <circle cx="300" cy="60" r="5" fill="#fff" filter="url(#glow)" />
  <circle cx="400" cy="60" r="5" fill="#fff" filter="url(#glow)" />
  <circle cx="500" cy="60" r="5" fill="#fff" filter="url(#glow)" />
  
  <!-- App name -->
  <text x="300" y="55" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#FFFFFF">
    Nettoyage Intelligent
  </text>
  
  <!-- Tagline -->
  <text x="300" y="80" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="rgba(255,255,255,0.9)">
    Advanced Data Cleaning Application
  </text>
  
  <!-- Decorative icons -->
  <g transform="translate(40, 50)" fill="rgba(255,255,255,0.9)">
    <path d="M10,0 L20,0 L20,20 L10,20 Z M0,5 L7,5 L7,15 L0,15 Z M23,8 L30,8 L30,12 L23,12 Z" />
  </g>
  
  <g transform="translate(530, 50)" fill="rgba(255,255,255,0.9)">
    <path d="M0,0 L8,0 L8,5 L15,5 L15,10 L8,10 L8,15 L0,15 Z M10,15 L25,15 L25,20 L10,20 Z M18,0 L30,0 L30,10 L18,10 Z" />
  </g>
</svg>
